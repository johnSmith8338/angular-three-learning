<div class="scene-container">
    <ngt-canvas 
        [camera]="{
            position:[0,0,5],
            fov:75
        }"
    >
        <ng-template canvasContent>
            <app-three-angular-scene
                [hotspots]="hotspots"
                [hotspotElements]="hotspotElementMap()"
                (meshSelected)="onMeshSelected($event)"
                (meshDeselected)="onMeshDeselected()"
                [focusMode]="focusMode()"
            />
        </ng-template>
    </ngt-canvas>
    
    <!-- желтые html точки -->
    <div class="hotspot-wrapper" [class.hidden]="isFocusMode()">
        @for (hotspot of hotspots; track hotspot.id) {
            <button #hotspotElement class="html-marker"
                [class.selected]="selectedHotspotId()===hotspot.id"
                [class.hovered]="hoveredHotspotId()===hotspot.id"
                [attr.data-hotspot-id]="hotspot.id"
                [attr.aria-label]="hotspot.title"
                (click)="onHotspotClick(hotspot)"
                (pointerenter)="onHotspotPointerEnter(hotspot)"
                (pointerleave)="onHotspotPointerLeave()"
            >
                <span class="html-marker_dot"></span>
                @if (selectedHotspotId()===hotspot.id) {
                    <span class="html-marker_tooltip">
                        <strong class="html-marker_label">{{hotspot.title}}</strong>
                        <span>{{hotspot.description}}</span>
                    </span>
                }
            </button>
        }
    </div>

    @if (selectedMeshHotspot(); as hotspot) {
        <aside class="focus-panel">
            <div class="focus-panel_content">
                <strong class="focus-panel_title">{{hotspot.title}}</strong>
                <p class="focus-panel_description">{{hotspot.description}}</p>
            </div>
            <button type="button"
                class="focus-panel_close"
                aria-label="close"
                (click)="onMeshDeselected()"
            >×</button>
        </aside>
    }
</div>
