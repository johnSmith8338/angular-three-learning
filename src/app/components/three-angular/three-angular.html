<div class="scene-container">
    <ngt-canvas 
        [camera]="{
            position:[0,0,5],
            fov:75
        }"
    >
        <ng-template canvasContent>
            <app-three-angular-scene
                [hotspots]="hotspots"
                [hotspotElements]="hotspotElementMap()"
                [selectedHotspotId]="selectedHotspotId()"
                (hotspotSelected)="onHotspotSelected($event)"
                (hotspotDeselected)="onHotspotDeselected()"
                [hoveredHotspotId]="hoveredHotspotId()"
                (hotspotPointerEnter)="onHotspotPointerEnter($event)"
                (hotspotPointerLeave)="onHotspotPointerLeave()"
            />
        </ng-template>
    </ngt-canvas>
    
    <!-- желтые html точки -->
    <div class="hotspot-wrapper">
        @for (hotspot of hotspots; track hotspot.id) {
            <button #hotspotElement class="html-marker"
                [class.selected]="selectedHotspotId()===hotspot.id"
                [class.hovered]="hoveredHotspotId()===hotspot.id"
                [attr.data-hotspot-id]="hotspot.id"
                [attr.aria-label]="hotspot.title"
            >
                <span class="html-marker_dot"></span>
                @if (selectedHotspotId()===hotspot.id) {
                    <span class="html-marker_tooltip">
                        <strong class="html-marker_label">{{hotspot.title}}</strong>
                        <span>{{hotspot.description}}</span>
                    </span>
                }
            </button>
        }
    </div>
</div>
