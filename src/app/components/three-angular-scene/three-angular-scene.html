<!-- <ngt-hemisphere-light *args="['#ffffff','#666666',1.5]" /> -->
<ngt-ambient-light [intensity]="0.2" />
<ngt-directional-light [position]="[3,4,5]" [intensity]="2" />
<ngt-directional-light [position]="[-4,1,2]" [intensity]="1" />
<ngt-directional-light [position]="[0,3,-4]" [intensity]="0.4" />

<ngt-group #modelRoot (pointerdown)="onModelPointerDown($event)">
    @if (gltf.value(); as gltf) {
        <ngt-primitive *args="[gltf.scene]" />
    }

    <!-- красные объемные сферы -->
    @for (hotspot of hotspots(); track hotspot.id) {
        <ngt-mesh 
            [position]="hotspot.position"
            [scale]="selectedHotspotId()===hotspot.id?[1.4,1.4,1.4]:hoveredHotspotId()===hotspot.id?[1.2,1.2,1.2]:[1,1,1]"
            (pointerdown)="onHotspotPointerDown(hotspot)"
            (pointerover)="onHotspotPointerEnter(hotspot)"
            (pointerout)="onHotspotPointerLeave()"
        >
            <ngt-sphere-geometry *args="[0.1,16,16]" />
            <ngt-mesh-standard-material 
                [color]="selectedHotspotId()===hotspot.id?'#ffff00':hoveredHotspotId()===hotspot.id?'#ffffff':'#ff0000'" 
            />
        </ngt-mesh>
    }
</ngt-group>

<ngts-orbit-controls 
    [options]="{
        makeDefault:true,
        target:[0,0,0],
        minDistance:0.5,
        maxDistance:8,
        minPolarAngle:Math.PI/4,
        maxPolarAngle:Math.PI*3/4,
        enableDamping:true,
        dampingFactor:0.05,
        enableZoom:true,
        enablePan:true
    }"
/>
